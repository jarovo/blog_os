[package]
name = "blog_os"         # or any other name
version = "0.1.0"
edition = "2024"

[dependencies]
rustyk-build = { version = "0.1.0", path = "rustyk-build" }
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
ovmf-prebuilt = "0.2.8"
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"

[build-dependencies]
rustyk = { 
    path = "rustyk",
    artifact=[
        "bin:kernel",
        "bin:test_heap_allocation",
        "bin:test_stack_overflow"],
    target = "x86_64-unknown-none"
}
rustyk-build = { version = "0.1.0", path = "rustyk-build" }

[workspace]
resolver = "3"
members = [ "rustyk", "rustyk-build" ]
